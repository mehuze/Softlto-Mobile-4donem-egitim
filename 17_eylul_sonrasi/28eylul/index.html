const urunleriGetir = async () => {
    try {
        console.log("Harici API'ye bağlanılıyor...");
        
        
        const response = await fetch("https://dummyjson.com/products");

        if (!response.ok) {
            throw new Error(`HTTP Hatası: ${response.status}`);
        }

        const data = await response.json();
        console.log(`Toplam ${data.products.length} adet ürün çekildi.`);

      
        const vitrin = data.products.slice(0, 5).map(p => ({
            isim: p.title,
            aciklama: p.description,
            fiyat: p.price,
            stok: p.stock,
            kategori: p.category,
          etiketler: p.tags.join(", ")
        }));

       
        console.table(vitrin);

    } catch (err) {
        console.error("Veri çekilirken bir hata oluştu:", err);
    }
};

urunleriGetir();
